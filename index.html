<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Practice</title>
<link rel="stylesheet" href="master.css">
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<main>
<div class="carousel js-carousel">
<div class="carousel__wrapper">
<div class="carousel__slide js-carousel__slide">
<p>Slide 1</p>
</div>
<div class="carousel__slide js-carousel__slide">
<p>Slide 2</p>
</div>
<div class="carousel__slide js-carousel__slide">
<p>Slide 3</p>
</div>
<div class="carousel__slide js-carousel__slide">
<p>Slide 4</p>
</div>
</div>
<div class="carousel__controls">
<button class="carousel__stop js-carousel__stop">Stop</button>
<button class="carousel__play js-carousel__play">Play</button>
<button class="carousel__previous js-carousel__previous">Previous</button>
<button class="carousel__next js-carousel__next">Next</button>
<ul class="carousel__pagination">
<template class="js-carousel__template">
<li class="carousel__page">
<button class="carousel__dot js-carousel__dot"></button>
</li>
</template>
</ul>
</div>
</div>
<!-- /.carousel -->
</main>
</body>
</html>
