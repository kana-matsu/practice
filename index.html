<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Practice</title>
<link rel="stylesheet" href="/assets/css/master.css">
<script type="module" src="/src/js/main.ts"></script>
</head>
<body>
<main>
<div class="carousel js-carousel">
<div class="carousel__wrapper js-carousel__wrapper">
<div class="carousel__slide js-carousel__slide">
<p>Slide 1</p>
</div>
<div class="carousel__slide js-carousel__slide">
<p>Slide 2</p>
<a href="__dummy__">link</a>
</div>
<div class="carousel__slide js-carousel__slide">
<p>Slide 3</p>
<a href="__dummy__">link</a>
</div>
<div class="carousel__slide js-carousel__slide">
<p>Slide 4</p>
</div>
</div>
<div class="carousel__controls">
<div class="carousel__toolbar">
<div class="carousel__toggle">
<button class="carousel__button js-carousel__button"><span class="carousel__button-text js-carousel__button-text">Stop</span></button>
</div>
<div class="carousel__navigation">
<button class="carousel__previous js-carousel__previous"><span class="carousel__previous-text">Previous</span></button>
<button class="carousel__next js-carousel__next"><span class="carousel__next-text">Next</span></button>
</div>
</div>
<ul class="carousel__pagination js-carousel__pagination">
<template class="js-carousel__template">
<li class="carousel__page">
<button class="carousel__dot js-carousel__dot"></button>
</li>
</template>
</ul>
</div>
</div>
<!-- /.carousel -->
</main>
</body>
</html>
